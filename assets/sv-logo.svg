<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="40" y1="60" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA940"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- S letterform -->
  <path d="
    M 42 75
    C 42 62, 52 54, 66 54
    C 80 54, 90 61, 90 72
    C 90 82, 82 87, 68 92
    C 52 97, 40 103, 40 116
    C 40 130, 52 140, 68 140
    C 84 140, 96 132, 96 120
  " stroke="url(#grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- V letterform with arrow -->
  <path d="
    M 96 60
    L 124 128
    L 152 60
  " stroke="url(#grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Arrow shaft going up-right from top of V right leg -->
  <path d="
    M 140 76
    L 166 50
  " stroke="url(#grad)" stroke-width="15" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Arrow head -->
  <path d="
    M 152 46
    L 170 44
    L 168 62
  " fill="url(#grad)" filter="url(#glow)"/>
</svg>
