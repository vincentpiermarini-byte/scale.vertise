<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Scalevertise | Currently at Capacity</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root { --ink:#141414; --silver:#4b4844; --ash:#6f6b66; --amber:#B45309; --accent:#F07000; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background:#fff; color:var(--silver); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 24px; font-weight:300;
}
.mark { width:64px; height:64px; margin-bottom:36px; opacity:0; animation:rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.05s forwards; }
.label {
  font-size:13px; font-weight:600; letter-spacing:0.15em; text-transform:uppercase; color:var(--amber);
  opacity:0; animation:rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
}
h1 {
  font-weight:400; letter-spacing:-0.04em; line-height:1.05; color:var(--ink);
  font-size:clamp(2.6rem,7vw,5rem); margin:20px 0 22px; text-wrap:balance;
  opacity:0; animation:rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s forwards;
}
p {
  font-size:18px; line-height:1.65; max-width:460px;
  opacity:0; animation:rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.35s forwards;
}
.back {
  display:inline-flex; margin-top:40px; text-decoration:none;
  background:var(--accent); color:#fff; font-weight:600; font-size:14px;
  letter-spacing:0.025em; text-transform:uppercase; padding:16px 30px; border-radius:24px;
  transition:transform 0.2s cubic-bezier(0.22,1,0.36,1), filter 0.2s;
  opacity:0; animation:rise 0.9s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
}
.back:hover { transform:translateY(-2px); filter:brightness(1.06); }
@keyframes rise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .mark,.label,h1,p,.back { opacity:1; animation:none; } }
</style>
</head>
<body>
  <img class="mark" src="/assets/sv-logo-globe.png" alt="Scalevertise">
  <div class="label">Currently at capacity</div>
  <h1>We're full<br>right now.</h1>
  <p>Scalevertise is not taking on any new clients at the moment. Every account we run gets daily attention, and our roster is full.</p>
  <a class="back" href="/">Back to site</a>
</body>
