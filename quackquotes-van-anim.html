  var outQuint = function (p){ return 1-Math.pow(1-p,5); };
  var backOut = function (p,s){ s=s||1.4; var q=p-1; return 1+(s+1)*q*q*q+s*q*q; };
  var lerp = function (a,b,p){ return a+(b-a)*p; };

  // build skyline strip: repeating flat houses and trees, 2160px tile, two copies
  var tile = '';
  var houses = [
    {x:40,  w:300, h:210, roof:60, body:'#FAEBD0', roofc:'#D5822F'},
    {x:420, w:250, h:170, roof:52, body:'#F5E5BE', roofc:'#1C1E25'},
    {x:760, w:330, h:230, roof:66, body:'#FAEBD0', roofc:'#EFC24C'},

    {x:1470,w:310, h:215, roof:62, body:'#FAEBD0', roofc:'#1C1E25'},

  ];
  var GROUND = 990;
  houses.forEach(function (hh) {
    var y = GROUND - hh.h;
    tile += '<rect x="'+hh.x+'" y="'+y+'" width="'+hh.w+'" height="'+hh.h+'" fill="'+hh.body+'"/>';

    }
  });

  trees.forEach(function (tx, i) {

    tile += '<circle cx="'+tx+'" cy="'+ty+'" r="'+r+'" fill="#7FA98C"/>';
    tile += '<circle cx="'+(tx-r*0.55)+'" cy="'+(ty+r*0.35)+'" r="'+(r*0.62)+'" fill="#8FB69B"/>';
    tile += '<circle cx="'+(tx+r*0.55)+'" cy="'+(ty+r*0.35)+'" r="'+(r*0.62)+'" fill="#749E82"/>';
  });
  var svg = '<svg viewBox="0 0 2160 1350" xmlns="http://www.w3.org/2000/svg">'+tile+'</svg>';
  $('skyline').innerHTML = '<div style="position:absolute;left:0">'+svg+'</div><div style="position:absolute;left:2160px">'+svg+'</div>';

  // dashes: enough to cover 2160
  var dhtml = '';
  for (var i = 0; i < 14; i++) dhtml += '<div class="dash" style="left:'+(i*165)+'px"></div>';
  $('dashes').innerHTML = dhtml;

  var HL = [
    { el:$('h0'), t0:60,    t1:4500 },
    { el:$('h1'), t0:4500,  t1:9000 },
    { el:$('h2'), t0:9000,  t1:99999 }
  ];
  var CAP = [
    { el:$('c0'), t0:500,   t1:4700 },
    { el:$('c1'), t0:4700,  t1:9200 },
    { el:$('c2'), t0:9200,  t1:99999 }
  ];

  var SKY_V = 130, ROAD_V = 620, CLOUD_V = 28;   // px per second, world moves right
  var WHEEL_DEG = 750;                            // deg per second, counterclockwise

  window.seek = function (t) {
    var s = t / 1000;

    HL.forEach(function (h) {
      var pin = backOut(tw(t, h.t0, 400), 1.7);
      var pout = tw(t, h.t1-160, 160);
      var active = t >= h.t0 && t < h.t1;
      h.el.style.opacity = active ? String((1-pout)) : '0';
      h.el.style.transform = active
        ? 'translateY(' + (lerp(74,0,pin) - 40*pout) + 'px)'
        : 'translateY(74px)';
    });
    CAP.forEach(function (c) {
      var pin = outQuint(tw(t, c.t0, 340));
      var pout = tw(t, c.t1-140, 140);
      var active = t >= c.t0 && t < c.t1;
      c.el.style.opacity = active ? String(pin*(1-pout)) : '0';
      c.el.style.transform = 'translateY(' + lerp(16,0,pin) + 'px)';
    });

    // world scroll (moves right; wrap by tile width)
    var skyX = (s * SKY_V) % 2160;
    $('skyline').style.transform = 'translateX(' + (skyX - 2160) + 'px)';
    var dashX = (s * ROAD_V) % 165;
    $('dashes').style.transform = 'translateX(' + (dashX - 165) + 'px)';

    // clouds drift
    [['cl0',0],['cl1',400],['cl2',900]].forEach(function (cc) {
      var x = ((s * CLOUD_V + cc[1]) % 1400) - 260;
      $(cc[0]).style.transform = 'translateX(' + x + 'px)';
    });

    // speed streaks: fast, staggered, fade in and out per pass
    [['st0',0],['st1',0.42],['st2',0.77]].forEach(function (ss) {
      var per = 0.9;
      var p = ((s / per) + ss[1]) % 1;
      var x = lerp(-200, 1200, p);
      $(ss[0]).style.transform = 'translateX(' + x + 'px)';
      $(ss[0]).style.opacity = String(0.4 * Math.sin(Math.PI * p));
    });

    // van: entrance from left, then steady with bob
    var enter = outQuint(tw(t, 150, 1400));
    var baseX = lerp(-820, 120, enter);
    var bob = 3.2 * Math.sin(2 * Math.PI * 2.1 * s);
    var sway = 0.5 * Math.sin(2 * Math.PI * 1.25 * s + 1.2);
    $('vangroup').style.left = '0px';
    $('vangroup').style.transform = 'translateX(' + baseX + 'px)';
    $('vanrot').style.transform = 'translateY(' + bob + 'px) rotate(' + (-3.2 + sway) + 'deg)';
    $('shadow').style.transform = 'scaleX(' + (1 - bob/220) + ')';

    // wheels spin counterclockwise
    var ang = -(s * WHEEL_DEG) % 360;
    $('wf').style.transform = 'rotate(' + ang + 'deg)';
    $('wr').style.transform = 'rotate(' + (ang - 47) + 'deg)';

    var ch = outQuint(tw(t, 0, 320));
    document.querySelector('.byline').style.opacity = String(ch);
    document.querySelector('.meta').style.opacity = String(ch);
  };

  window.seek(0);
})();
</script>
</body>
</html>
