<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#0a0806; font-family:system-ui,sans-serif; }

  .page {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    gap:24px;
    padding:32px;
  }

  canvas {
    width:100%;
    max-width:860px;
    height:auto;
    border-radius:8px;
    display:block;
  }

  .dl-btn {
    display:inline-block;
    background:#FF7A00;
    color:#0a0806;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.04em;
    padding:16px 40px;
    border-radius:100px;
    border:none;
    cursor:pointer;
    text-decoration:none;
  }
  .dl-btn:hover { opacity:0.88; }
  .label {
    color:#C4A882;
    font-size:0.82rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.5;
  }
</style>
</head>
<body>
<div class="page">
  <div class="label">VSL Background — 1920 × 1080</div>
  <canvas id="c" width="1920" height="1080"></canvas>
  <a class="dl-btn" id="dl">Download Image</a>
</div>

<script>
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W = 1920, H = 1080;

// Base dark gradient
var base = ctx.createRadialGradient(W*0.68, H*0.38, 0, W*0.68, H*0.38, W*0.72);
base.addColorStop(0, '#2a2420');
base.addColorStop(0.45, '#161310');
base.addColorStop(1, '#0a0806');
ctx.fillStyle = base;
ctx.fillRect(0, 0, W, H);

// Orange glow top-right
var og = ctx.createRadialGradient(W+80, -120, 0, W+80, -120, 680);
og.addColorStop(0, 'rgba(255,122,0,0.18)');
og.addColorStop(0.45, 'rgba(255,122,0,0.06)');
og.addColorStop(1, 'rgba(255,122,0,0)');
ctx.fillStyle = og;
ctx.fillRect(0, 0, W, H);

// Warm gold glow bottom-left
var wg = ctx.createRadialGradient(60, H+100, 0, 60, H+100, 500);
wg.addColorStop(0, 'rgba(196,168,130,0.09)');
wg.addColorStop(1, 'rgba(196,168,130,0)');
ctx.fillStyle = wg;
ctx.fillRect(0, 0, W, H);

// Logo watermark bottom-left
ctx.globalAlpha = 0.18;
ctx.font = 'bold 52px Georgia, serif';
ctx.fillStyle = '#C4A882';
ctx.fillText('SV', 64, H - 52);

ctx.font = '400 30px Georgia, serif';
ctx.letterSpacing = '4px';
ctx.fillStyle = '#C4A882';
ctx.fillText('scale', 136, H - 52);

ctx.fillStyle = '#FF7A00';
ctx.fillText('vertise', 136 + ctx.measureText('scale').width, H - 52);

ctx.globalAlpha = 1;

// Wire up download — open as image in new tab (works on mobile Safari)
var dl = document.getElementById('dl');
dl.addEventListener('click', function() {
  var dataUrl = c.toDataURL('image/png');
  var win = window.open();
  win.document.write('<img src="' + dataUrl + '" style="width:100%;display:block;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold the image, then tap Save to Photos</p>');
});
</script>
</body>
</html>
