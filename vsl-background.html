<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#111; font-family:system-ui,sans-serif; }
  .page {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    gap:24px;
    padding:32px;
  }
  canvas { width:100%; max-width:860px; height:auto; border-radius:8px; display:block; }
  .dl-btn {
    display:inline-block;
    background:#FF7A00;
    color:#111;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.04em;
    padding:16px 40px;
    border-radius:100px;
    border:none;
    cursor:pointer;
  }
  .dl-btn:hover { opacity:0.88; }
  .label { color:#C4A882; font-size:0.82rem; letter-spacing:0.08em; text-transform:uppercase; opacity:0.5; }
</style>
</head>
<body>
<div class="page">
  <div class="label">VSL Background — 1920 × 1080</div>
  <canvas id="c" width="1920" height="1080"></canvas>
  <button class="dl-btn" id="dl">Download Image</button>
</div>

<script>
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W = 1920, H = 1080;

// Base
ctx.fillStyle = '#141414';
ctx.fillRect(0, 0, W, H);

// Subtle dot grid
var gridSize = 48;
var dotSize = 1.2;
ctx.fillStyle = 'rgba(255,255,255,0.07)';
for (var x = gridSize; x < W; x += gridSize) {
  for (var y = gridSize; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.arc(x, y, dotSize, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Dark vignette over grid — edges fade to solid dark
var vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, W*0.78);
vig.addColorStop(0,   'rgba(20,20,20,0)');
vig.addColorStop(0.6, 'rgba(20,20,20,0.5)');
vig.addColorStop(1,   'rgba(20,20,20,0.96)');
ctx.fillStyle = vig;
ctx.fillRect(0, 0, W, H);

// Subtle warm center lift so it doesn't look flat gray
var lift = ctx.createRadialGradient(W*0.5, H*0.45, 0, W*0.5, H*0.45, W*0.45);
lift.addColorStop(0,   'rgba(255,122,0,0.06)');
lift.addColorStop(0.5, 'rgba(255,122,0,0.02)');
lift.addColorStop(1,   'rgba(255,122,0,0)');
ctx.fillStyle = lift;
ctx.fillRect(0, 0, W, H);

// Top accent line
var lineGrad = ctx.createLinearGradient(0, 0, W, 0);
lineGrad.addColorStop(0,   'rgba(255,122,0,0)');
lineGrad.addColorStop(0.25,'rgba(255,122,0,0.7)');
lineGrad.addColorStop(0.75,'rgba(255,122,0,0.7)');
lineGrad.addColorStop(1,   'rgba(255,122,0,0)');
ctx.fillStyle = lineGrad;
ctx.fillRect(0, 0, W, 2);

// Bottom accent line
ctx.fillStyle = lineGrad;
ctx.fillRect(0, H - 2, W, 2);

// Logo block — bottom right
var lx = W - 430;
var ly = H - 60;

ctx.globalAlpha = 0.85;

// SV
ctx.font = 'bold 62px Georgia, serif';
ctx.fillStyle = '#FF7A00';
ctx.fillText('SV', lx, ly);

// Vertical divider
ctx.fillStyle = 'rgba(255,255,255,0.2)';
ctx.fillRect(lx + 86, ly - 48, 1.5, 56);

// scalevertise
ctx.font = '300 26px Georgia, serif';
ctx.letterSpacing = '5px';
ctx.fillStyle = '#F6F2E8';
ctx.fillText('scale', lx + 102, ly - 18);
ctx.fillStyle = '#FF7A00';
ctx.fillText('vertise', lx + 102 + ctx.measureText('scale').width, ly - 18);

// Tagline
ctx.font = '400 15px system-ui, sans-serif';
ctx.letterSpacing = '3.5px';
ctx.fillStyle = 'rgba(255,255,255,0.35)';
ctx.fillText('FILL BEDS. GUARANTEED.', lx + 102, ly + 12);

ctx.globalAlpha = 1;

// Download
document.getElementById('dl').addEventListener('click', function() {
  var dataUrl = c.toDataURL('image/png');
  var win = window.open();
  win.document.write('<img src="' + dataUrl + '" style="width:100%;display:block;background:#111;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold the image, then tap Save to Photos</p>');
});
</script>
</body>
</html>
