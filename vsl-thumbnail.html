<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#0a0806; font-family:system-ui,sans-serif; }
  .page { display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:48px; padding:48px 32px; }
  .thumb-block { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:860px; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; }
  .dl-btn { background:#FF7A00; color:#0a0806; font-size:1rem; font-weight:700; padding:14px 36px; border-radius:100px; border:none; cursor:pointer; }
  .dl-btn:hover { opacity:0.88; }
  h2 { color:#F6F2E8; font-size:0.9rem; font-weight:600; letter-spacing:0.05em; opacity:0.4; text-transform:uppercase; }
</style>
</head>
<body>
<div class="page">
  <div class="thumb-block">
    <h2>Option A</h2>
    <canvas id="cA" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cA')">Download A</button>
  </div>
  <div class="thumb-block">
    <h2>Option B</h2>
    <canvas id="cB" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cB')">Download B</button>
  </div>
  <div class="thumb-block">
    <h2>Option C</h2>
    <canvas id="cC" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cC')">Download C</button>
  </div>
</div>
<script>
var W = 1280, H = 720;

function dl(id) {
  var u = document.getElementById(id).toDataURL('image/png');
  var w = window.open();
  w.document.write('<img src="'+u+'" style="width:100%;display:block;background:#000;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold, then Save to Photos</p>');
}

function playBtn(ctx, cx, cy, r) {
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.4);
  g.addColorStop(0,'rgba(255,122,0,0.28)');
  g.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='rgba(14,11,8,0.82)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#FF7A00'; ctx.lineWidth=5; ctx.stroke();
  var t=r*0.38;
  ctx.beginPath();
  ctx.moveTo(cx-t*0.65, cy-t*1.1);
  ctx.lineTo(cx-t*0.65, cy+t*1.1);
  ctx.lineTo(cx+t*1.55, cy);
  ctx.closePath();
  ctx.fillStyle='#FF7A00'; ctx.fill();
}

/* ===== A =====
   Layout: eyebrow top-left, two-line headline left, play button right-centre
   Feels like a real talking-head thumbnail without needing a face
*/
(function(){
  var c=document.getElementById('cA'), ctx=c.getContext('2d');

  // Background — dark warm gradient
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#1a1410');
  bg.addColorStop(1,'#080604');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Orange glow bottom-left
  var og=ctx.createRadialGradient(0,H,0,0,H,800);
  og.addColorStop(0,'rgba(255,122,0,0.14)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  // Left orange bar
  ctx.fillStyle='#FF7A00';
  ctx.fillRect(0,0,8,H);

  // Eyebrow
  ctx.font='600 26px system-ui, sans-serif';
  ctx.letterSpacing='3px';
  ctx.fillStyle='#FF7A00';
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillText('FOR CARE HOMES', 60, 140);
  ctx.letterSpacing='0px';

  // Main headline — two lines, big serif
  ctx.font='bold 112px Georgia, serif';
  ctx.fillStyle='#F6F2E8';
  ctx.fillText('Watch This', 56, 310);
  ctx.fillStyle='#FF7A00';
  ctx.fillText('Before You', 56, 430);
  ctx.fillStyle='#F6F2E8';
  ctx.fillText('Book a Call.', 56, 550);

  // Scalevertise brand bottom left
  ctx.globalAlpha=0.45;
  ctx.font='300 20px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.fillText('SCALEVERTISE', 60, H-44);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;

  // Play button — right side, vertically centred
  playBtn(ctx, W*0.78, H*0.5, 96);
})();

/* ===== B =====
   Layout: centred, stacked — small label, big "4 Minutes.", play below
   Clean and direct about the time commitment
*/
(function(){
  var c=document.getElementById('cB'), ctx=c.getContext('2d');

  var bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,W*0.75);
  bg.addColorStop(0,'#1c1710');
  bg.addColorStop(1,'#070503');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,W*0.7);
  v.addColorStop(0,'rgba(7,5,3,0)');
  v.addColorStop(1,'rgba(7,5,3,0.88)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Accent lines top + bottom
  var ln=ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.3,'rgba(255,122,0,0.6)');
  ln.addColorStop(0.7,'rgba(255,122,0,0.6)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=ln;
  ctx.fillRect(0,0,W,3); ctx.fillRect(0,H-3,W,3);

  ctx.textAlign='center';

  // Small label
  ctx.font='600 24px system-ui, sans-serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='rgba(255,122,0,0.7)';
  ctx.textBaseline='alphabetic';
  ctx.fillText('CARE HOME OWNERS', W/2, 130);
  ctx.letterSpacing='0px';

  // Big headline
  ctx.font='bold 148px Georgia, serif';
  ctx.fillStyle='#F6F2E8';
  ctx.fillText('See Exactly', W/2, 320);
  ctx.fillStyle='#FF7A00';
  ctx.fillText('How It Works.', W/2, 470);

  // Play button below headline
  playBtn(ctx, W/2, 590, 64);

  // Brand
  ctx.globalAlpha=0.4;
  ctx.font='300 18px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.fillText('SCALEVERTISE', W/2, H-44);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
})();

/* ===== C =====
   Layout: top eyebrow + big guarantee stat centred + play below
   The "or you don't pay" hook
*/
(function(){
  var c=document.getElementById('cC'), ctx=c.getContext('2d');

  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#161210');
  bg.addColorStop(1,'#060504');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Orange glow top-centre
  var og=ctx.createRadialGradient(W/2,0,0,W/2,0,700);
  og.addColorStop(0,'rgba(255,122,0,0.16)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  // Vignette
  var v=ctx.createRadialGradient(W/2,H*0.35,H*0.1,W/2,H*0.35,W*0.7);
  v.addColorStop(0,'rgba(6,5,4,0)');
  v.addColorStop(1,'rgba(6,5,4,0.9)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';

  // Eyebrow
  ctx.font='600 24px system-ui, sans-serif';
  ctx.letterSpacing='4px';
  ctx.fillStyle='rgba(255,122,0,0.65)';
  ctx.fillText('FOR CARE HOME OWNERS', W/2, 118);
  ctx.letterSpacing='0px';

  // Headline
  ctx.font='bold 124px Georgia, serif';
  ctx.fillStyle='#F6F2E8';
  ctx.fillText('20–30 Resident', W/2, 284);
  ctx.fillText('Appointments.', W/2, 408);

  // Subline
  ctx.font='400 36px system-ui, sans-serif';
  ctx.fillStyle='rgba(246,242,232,0.45)';
  ctx.fillText('Or you don\'t pay. Here\'s how.', W/2, 484);

  // Play button
  playBtn(ctx, W/2, 594, 66);

  // Brand
  ctx.globalAlpha=0.4;
  ctx.font='300 18px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.fillText('SCALEVERTISE', W/2, H-44);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
})();
</script>
</body>
</html>
