<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#0a0806; font-family:system-ui,sans-serif; }
  .page { display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:48px; padding:48px 32px; }
  .thumb-block { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:860px; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; }
  .dl-btn { background:#FF7A00; color:#0a0806; font-size:1rem; font-weight:700; padding:14px 36px; border-radius:100px; border:none; cursor:pointer; }
  .dl-btn:hover { opacity:0.88; }
  h2 { color:#F6F2E8; font-size:0.9rem; font-weight:600; letter-spacing:0.05em; opacity:0.4; text-transform:uppercase; }
</style>
</head>
<body>
<div class="page">
  <div class="thumb-block">
    <h2>Option A — Glow</h2>
    <canvas id="cA" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cA')">Download A</button>
  </div>
  <div class="thumb-block">
    <h2>Option B — Dot Grid</h2>
    <canvas id="cB" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cB')">Download B</button>
  </div>
  <div class="thumb-block">
    <h2>Option C — Frame</h2>
    <canvas id="cC" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cC')">Download C</button>
  </div>
</div>
<script>
var W = 1280, H = 720;

function dl(id) {
  var u = document.getElementById(id).toDataURL('image/png');
  var w = window.open();
  w.document.write('<img src="'+u+'" style="width:100%;display:block;background:#000;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold, then Save to Photos</p>');
}

function playBtn(ctx, r) {
  var cx = W/2, cy = H/2;
  // outer glow
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.8);
  g.addColorStop(0,'rgba(255,122,0,0.28)');
  g.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,r*2.8,0,Math.PI*2); ctx.fill();
  // dark fill inside ring
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='rgba(14,11,8,0.72)'; ctx.fill();
  // ring
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#FF7A00'; ctx.lineWidth=5; ctx.stroke();
  // triangle — optically centred (nudged right)
  var t = r * 0.38;
  ctx.beginPath();
  ctx.moveTo(cx - t*0.65, cy - t*1.1);
  ctx.lineTo(cx - t*0.65, cy + t*1.1);
  ctx.lineTo(cx + t*1.55, cy);
  ctx.closePath();
  ctx.fillStyle='#FF7A00'; ctx.fill();
}

/* ===== A: WARM GLOW ===== */
(function(){
  var c=document.getElementById('cA'), ctx=c.getContext('2d');
  // Very dark base
  ctx.fillStyle='#0d0a07'; ctx.fillRect(0,0,W,H);
  // Orange radial glow — centred
  var og=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.55);
  og.addColorStop(0,'rgba(255,122,0,0.18)');
  og.addColorStop(0.5,'rgba(255,122,0,0.07)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
  // Edge vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,W*0.72);
  v.addColorStop(0,'rgba(13,10,7,0)');
  v.addColorStop(1,'rgba(13,10,7,0.94)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  // Play button
  playBtn(ctx, 100);
  // Single line below — small, understated
  ctx.font='400 24px system-ui, sans-serif';
  ctx.letterSpacing='4px';
  ctx.fillStyle='rgba(246,242,232,0.32)';
  ctx.textAlign='center';
  ctx.fillText('FILL BEDS. GUARANTEED.', W/2, H/2 + 160);
  ctx.letterSpacing='0px';
})();

/* ===== B: DOT GRID ===== */
(function(){
  var c=document.getElementById('cB'), ctx=c.getContext('2d');
  // Dark base
  ctx.fillStyle='#141414'; ctx.fillRect(0,0,W,H);
  // Dot grid — same as VSL background
  ctx.fillStyle='rgba(255,255,255,0.07)';
  for(var x=48;x<W;x+=48) for(var y=48;y<H;y+=48){
    ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
  }
  // Vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,W*0.75);
  v.addColorStop(0,'rgba(20,20,20,0)');
  v.addColorStop(0.6,'rgba(20,20,20,0.5)');
  v.addColorStop(1,'rgba(20,20,20,0.96)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  // Accent lines top + bottom (same as bg)
  var ln=ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.25,'rgba(255,122,0,0.7)');
  ln.addColorStop(0.75,'rgba(255,122,0,0.7)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);
  // Play button
  playBtn(ctx, 100);
  // SV mark — small, top centre
  ctx.font='bold 30px Georgia, serif';
  ctx.fillStyle='rgba(255,122,0,0.55)';
  ctx.textAlign='center';
  ctx.fillText('SV', W/2, 58);
})();

/* ===== C: FRAME ===== */
(function(){
  var c=document.getElementById('cC'), ctx=c.getContext('2d');
  // Dark base
  ctx.fillStyle='#0c0a08'; ctx.fillRect(0,0,W,H);
  // Subtle centre glow
  var og=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.5);
  og.addColorStop(0,'rgba(255,122,0,0.09)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
  // Vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,W*0.7);
  v.addColorStop(0,'rgba(12,10,8,0)');
  v.addColorStop(1,'rgba(12,10,8,0.9)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  // Thin orange border frame inset from edges
  var pad=40;
  ctx.strokeStyle='rgba(255,122,0,0.35)';
  ctx.lineWidth=2;
  ctx.strokeRect(pad, pad, W-pad*2, H-pad*2);
  // Corner accents — small bright squares at each corner
  var clen=32, cw=3;
  ctx.fillStyle='#FF7A00';
  // top-left
  ctx.fillRect(pad, pad, clen, cw); ctx.fillRect(pad, pad, cw, clen);
  // top-right
  ctx.fillRect(W-pad-clen, pad, clen, cw); ctx.fillRect(W-pad-cw, pad, cw, clen);
  // bottom-left
  ctx.fillRect(pad, H-pad-cw, clen, cw); ctx.fillRect(pad, H-pad-clen, cw, clen);
  // bottom-right
  ctx.fillRect(W-pad-clen, H-pad-cw, clen, cw); ctx.fillRect(W-pad-cw, H-pad-clen, cw, clen);
  // Play button
  playBtn(ctx, 100);
})();
</script>
</body>
</html>
