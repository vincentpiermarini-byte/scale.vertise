<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#0a0806; font-family:system-ui,sans-serif; }
  .page { display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:48px; padding:48px 32px; }
  .thumb-block { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:860px; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; }
  .dl-btn { background:#FF7A00; color:#0a0806; font-size:1rem; font-weight:700; padding:14px 36px; border-radius:100px; border:none; cursor:pointer; }
  .dl-btn:hover { opacity:0.88; }
  h2 { color:#F6F2E8; font-size:0.9rem; font-weight:600; letter-spacing:0.05em; opacity:0.4; text-transform:uppercase; }
</style>
</head>
<body>
<div class="page">
  <div class="thumb-block">
    <h2>Option A</h2>
    <canvas id="cA" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cA')">Download A</button>
  </div>
  <div class="thumb-block">
    <h2>Option B</h2>
    <canvas id="cB" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cB')">Download B</button>
  </div>
  <div class="thumb-block">
    <h2>Option C</h2>
    <canvas id="cC" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cC')">Download C</button>
  </div>
</div>
<script>
var W = 1280, H = 720;

function dl(id) {
  var u = document.getElementById(id).toDataURL('image/png');
  var w = window.open();
  w.document.write('<img src="'+u+'" style="width:100%;display:block;background:#000;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold, then Save to Photos</p>');
}

function playBtn(ctx, cx, cy, r) {
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.4);
  g.addColorStop(0,'rgba(255,122,0,0.28)');
  g.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='rgba(14,11,8,0.82)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#FF7A00'; ctx.lineWidth=5; ctx.stroke();
  var t=r*0.38;
  ctx.beginPath();
  ctx.moveTo(cx-t*0.65, cy-t*1.1);
  ctx.lineTo(cx-t*0.65, cy+t*1.1);
  ctx.lineTo(cx+t*1.55, cy);
  ctx.closePath();
  ctx.fillStyle='#FF7A00'; ctx.fill();
}

/* A — White sans-serif, one line above play, dark background */
(function(){
  var c=document.getElementById('cA'), ctx=c.getContext('2d');

  ctx.fillStyle='#111010'; ctx.fillRect(0,0,W,H);

  var v=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,W*0.7);
  v.addColorStop(0,'rgba(17,16,16,0)');
  v.addColorStop(1,'rgba(17,16,16,0.96)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // One clean white line — light weight sans, all lowercase
  ctx.font='300 72px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.88)';
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillText('watch before you book.', W/2, H/2 - 80);

  playBtn(ctx, W/2, H/2 + 80, 80);
})();

/* B — Orange solid bar behind white text, play button below */
(function(){
  var c=document.getElementById('cB'), ctx=c.getContext('2d');

  ctx.fillStyle='#0e0c0a'; ctx.fillRect(0,0,W,H);

  var v=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,W*0.68);
  v.addColorStop(0,'rgba(14,12,10,0)');
  v.addColorStop(1,'rgba(14,12,10,0.94)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Orange pill/bar behind the text
  var barH=90, barY=H/2-160;
  var barPad=60;
  ctx.font='700 64px system-ui, sans-serif';
  var textW=ctx.measureText('4 minutes.').width;
  ctx.fillStyle='#FF7A00';
  ctx.beginPath();
  ctx.roundRect(W/2 - textW/2 - barPad, barY - barH*0.78, textW + barPad*2, barH, barH/2);
  ctx.fill();

  // White text on bar
  ctx.fillStyle='#ffffff';
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillText('4 minutes.', W/2, barY);

  // Subtext below bar
  ctx.font='300 32px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('That\'s all it takes to understand.', W/2, barY + 72);

  playBtn(ctx, W/2, H/2 + 120, 76);
})();

/* C — Left-aligned, thin white text, orange accent dot, play right side */
(function(){
  var c=document.getElementById('cC'), ctx=c.getContext('2d');

  ctx.fillStyle='#0f0d0b'; ctx.fillRect(0,0,W,H);

  // Subtle warm glow left
  var og=ctx.createRadialGradient(180,H/2,0,180,H/2,600);
  og.addColorStop(0,'rgba(255,122,0,0.1)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  var v=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,W*0.72);
  v.addColorStop(0,'rgba(15,13,11,0)');
  v.addColorStop(1,'rgba(15,13,11,0.95)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Orange dot accent
  ctx.beginPath(); ctx.arc(72, H/2 - 10, 10, 0, Math.PI*2);
  ctx.fillStyle='#FF7A00'; ctx.fill();

  // Two short lines, left aligned, white, light weight
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='300 68px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText('How we fill beds', 108, H/2 - 20);
  ctx.font='300 68px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText('in 30 days.', 108, H/2 + 70);

  // Play button right side
  playBtn(ctx, W - 200, H/2 + 24, 80);
})();
</script>
</body>
</html>
