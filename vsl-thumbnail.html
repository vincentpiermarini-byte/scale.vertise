<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#0a0806; font-family:system-ui,sans-serif; }
  .page { display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:48px; padding:48px 32px; }
  .thumb-block { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:860px; }
  canvas { width:100%; height:auto; border-radius:8px; display:block; }
  .dl-btn { background:#FF7A00; color:#0a0806; font-size:1rem; font-weight:700; padding:14px 36px; border-radius:100px; border:none; cursor:pointer; }
  .dl-btn:hover { opacity:0.88; }
  h2 { color:#F6F2E8; font-size:0.9rem; font-weight:600; letter-spacing:0.05em; opacity:0.4; text-transform:uppercase; }
</style>
</head>
<body>
<div class="page">
  <div class="thumb-block">
    <h2>Option A — Fill Beds</h2>
    <canvas id="cA" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cA')">Download A</button>
  </div>
  <div class="thumb-block">
    <h2>Option B — 30 Days</h2>
    <canvas id="cB" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cB')">Download B</button>
  </div>
  <div class="thumb-block">
    <h2>Option C — Split</h2>
    <canvas id="cC" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cC')">Download C</button>
  </div>
</div>
<script>
var W = 1280, H = 720;

function dl(id) {
  var u = document.getElementById(id).toDataURL('image/png');
  var w = window.open();
  w.document.write('<img src="'+u+'" style="width:100%;display:block;background:#000;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold, then Save to Photos</p>');
}

function playBtn(ctx, cx, cy, r) {
  var g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.6);
  g.addColorStop(0,'rgba(255,122,0,0.3)');
  g.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*2.6,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='rgba(14,11,8,0.8)'; ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#FF7A00'; ctx.lineWidth=5; ctx.stroke();

  var t = r*0.38;
  ctx.beginPath();
  ctx.moveTo(cx - t*0.65, cy - t*1.1);
  ctx.lineTo(cx - t*0.65, cy + t*1.1);
  ctx.lineTo(cx + t*1.55, cy);
  ctx.closePath();
  ctx.fillStyle='#FF7A00'; ctx.fill();
}

/* ===== A: "FILL BEDS." — big type, play on top ===== */
(function(){
  var c=document.getElementById('cA'), ctx=c.getContext('2d');

  ctx.fillStyle='#0e0b08'; ctx.fillRect(0,0,W,H);

  // Warm centre glow
  var og=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.6);
  og.addColorStop(0,'rgba(255,122,0,0.13)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  // Edge vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,W*0.72);
  v.addColorStop(0,'rgba(14,11,8,0)');
  v.addColorStop(1,'rgba(14,11,8,0.95)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Big type — "FILL" white, "BEDS." orange, centred
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  // ghost version behind for depth
  ctx.globalAlpha=0.06;
  ctx.font='bold 280px Georgia, serif';
  ctx.fillStyle='#FF7A00';
  ctx.fillText('FILL BEDS.', W/2, H/2);
  ctx.globalAlpha=1;

  // readable version
  ctx.font='bold 148px Georgia, serif';
  ctx.fillStyle='#F6F2E8';
  // measure "FILL " to split colour
  var fillW = ctx.measureText('FILL ').width;
  var bedsW = ctx.measureText('BEDS.').width;
  var totalW = fillW + bedsW;
  ctx.fillText('FILL ', W/2 - bedsW/2, H/2);
  ctx.fillStyle='#FF7A00';
  ctx.fillText('BEDS.', W/2 + fillW/2, H/2);

  // Accent lines
  var ln=ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.35,'rgba(255,122,0,0.55)');
  ln.addColorStop(0.65,'rgba(255,122,0,0.55)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);

  // Play button dead centre over text
  playBtn(ctx, W/2, H/2, 82);

  // Brand bottom — well above Vimeo bar
  ctx.globalAlpha=0.4;
  ctx.font='300 18px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.textBaseline='alphabetic';
  ctx.fillText('SCALEVERTISE', W/2, H - 56);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
})();

/* ===== B: "30" — big stat, play on top ===== */
(function(){
  var c=document.getElementById('cB'), ctx=c.getContext('2d');

  ctx.fillStyle='#0c0a07'; ctx.fillRect(0,0,W,H);

  // Orange glow
  var og=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.55);
  og.addColorStop(0,'rgba(255,122,0,0.15)');
  og.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);

  // Vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,W*0.7);
  v.addColorStop(0,'rgba(12,10,7,0)');
  v.addColorStop(1,'rgba(12,10,7,0.95)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Giant ghost "30"
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.globalAlpha=0.08;
  ctx.font='bold 600px Georgia, serif';
  ctx.fillStyle='#FF7A00';
  ctx.fillText('30', W/2, H/2);
  ctx.globalAlpha=1;

  // Visible "30" — sized so play button sits nicely on it
  ctx.globalAlpha=0.22;
  ctx.font='bold 340px Georgia, serif';
  ctx.fillStyle='#FF7A00';
  ctx.fillText('30', W/2, H/2 + 20);
  ctx.globalAlpha=1;

  // Accent lines
  var ln=ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.35,'rgba(255,122,0,0.55)');
  ln.addColorStop(0.65,'rgba(255,122,0,0.55)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);

  // "DAYS" label above, small
  ctx.font='600 22px system-ui, sans-serif';
  ctx.letterSpacing='6px';
  ctx.fillStyle='rgba(255,122,0,0.55)';
  ctx.textBaseline='alphabetic';
  ctx.fillText('DAYS', W/2, H/2 - 155);
  ctx.letterSpacing='0px';

  // Play button dead centre
  playBtn(ctx, W/2, H/2, 86);

  // Brand
  ctx.globalAlpha=0.4;
  ctx.font='300 18px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.fillText('SCALEVERTISE', W/2, H - 56);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
})();

/* ===== C: DIAGONAL SPLIT ===== */
(function(){
  var c=document.getElementById('cC'), ctx=c.getContext('2d');

  ctx.fillStyle='#0d0b08'; ctx.fillRect(0,0,W,H);

  // Left half — dark warm
  var lp=ctx.createLinearGradient(0,0,W*0.55,0);
  lp.addColorStop(0,'rgba(255,122,0,0.13)');
  lp.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=lp; ctx.fillRect(0,0,W,H);

  // Diagonal dividing band
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(-12 * Math.PI/180);
  var band=ctx.createLinearGradient(-60,0,60,0);
  band.addColorStop(0,'rgba(255,122,0,0)');
  band.addColorStop(0.3,'rgba(255,122,0,0.22)');
  band.addColorStop(0.5,'rgba(255,122,0,0.38)');
  band.addColorStop(0.7,'rgba(255,122,0,0.22)');
  band.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=band;
  ctx.fillRect(-120, -H, 240, H*2);
  // thin bright line on centre of band
  ctx.fillStyle='rgba(255,122,0,0.55)';
  ctx.fillRect(-1.5, -H, 3, H*2);
  ctx.restore();

  // Vignette
  var v=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,W*0.72);
  v.addColorStop(0,'rgba(13,11,8,0)');
  v.addColorStop(1,'rgba(13,11,8,0.92)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // Top + bottom accent lines
  var ln=ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.35,'rgba(255,122,0,0.55)');
  ln.addColorStop(0.65,'rgba(255,122,0,0.55)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle=ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);

  // Play button dead centre, sits on the diagonal line
  playBtn(ctx, W/2, H/2, 90);

  // Brand
  ctx.globalAlpha=0.4;
  ctx.font='300 18px Georgia, serif';
  ctx.letterSpacing='5px';
  ctx.fillStyle='#C4A882';
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillText('SCALEVERTISE', W/2, H - 56);
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
})();
</script>
</body>
</html>
