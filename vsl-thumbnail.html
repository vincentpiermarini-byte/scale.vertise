<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#0a0806; font-family:system-ui,sans-serif; }
  .page {
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    gap:48px;
    padding:48px 32px;
  }
  .thumb-block {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    width:100%;
    max-width:860px;
  }
  canvas { width:100%; height:auto; border-radius:8px; display:block; }
  .dl-btn {
    background:#FF7A00;
    color:#0a0806;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.04em;
    padding:14px 36px;
    border-radius:100px;
    border:none;
    cursor:pointer;
  }
  .dl-btn:hover { opacity:0.88; }
  h2 { color:#F6F2E8; font-size:0.95rem; font-weight:600; letter-spacing:0.04em; opacity:0.5; text-transform:uppercase; }
</style>
</head>
<body>
<div class="page">

  <div class="thumb-block">
    <h2>Option A — Monogram</h2>
    <canvas id="cA" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cA')">Download A</button>
  </div>

  <div class="thumb-block">
    <h2>Option B — Ghost Stat</h2>
    <canvas id="cB" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cB')">Download B</button>
  </div>

  <div class="thumb-block">
    <h2>Option C — Orange Slash</h2>
    <canvas id="cC" width="1280" height="720"></canvas>
    <button class="dl-btn" onclick="dl('cC')">Download C</button>
  </div>

</div>
<script>
var W = 1280, H = 720;

function dl(id) {
  var dataUrl = document.getElementById(id).toDataURL('image/png');
  var win = window.open();
  win.document.write('<img src="' + dataUrl + '" style="width:100%;display:block;background:#000;"><p style="font-family:sans-serif;text-align:center;padding:12px;color:#666;">Press and hold, then Save to Photos</p>');
}

function playBtn(ctx, cx, cy, r) {
  // glow
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.5);
  g.addColorStop(0, 'rgba(255,122,0,0.2)');
  g.addColorStop(1, 'rgba(255,122,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r * 2.5, 0, Math.PI*2); ctx.fill();
  // fill
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,122,0,0.18)'; ctx.fill();
  // ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = '#FF7A00'; ctx.lineWidth = 4; ctx.stroke();
  // triangle — nudge right so it looks centered optically
  var t = r * 0.36;
  ctx.beginPath();
  ctx.moveTo(cx - t * 0.7, cy - t * 1.1);
  ctx.lineTo(cx - t * 0.7, cy + t * 1.1);
  ctx.lineTo(cx + t * 1.5, cy);
  ctx.closePath();
  ctx.fillStyle = '#FF7A00'; ctx.fill();
}

/* ===== A: MONOGRAM ===== */
/* Big faded "SV" behind the play button — the logo IS the graphic */
(function(){
  var c = document.getElementById('cA'), ctx = c.getContext('2d');

  // Base
  var base = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  base.addColorStop(0, '#221c13');
  base.addColorStop(1, '#070605');
  ctx.fillStyle = base; ctx.fillRect(0,0,W,H);

  // Dot grid
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (var x=56;x<W;x+=56) for (var y=56;y<H;y+=56) {
    ctx.beginPath(); ctx.arc(x,y,1.1,0,Math.PI*2); ctx.fill();
  }

  // Vignette
  var vig = ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,W*0.68);
  vig.addColorStop(0,'rgba(7,6,5,0)'); vig.addColorStop(1,'rgba(7,6,5,0.9)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  // Giant ghost "SV" centered
  ctx.save();
  ctx.font = 'bold 520px Georgia, serif';
  ctx.fillStyle = 'rgba(255,122,0,0.07)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SV', W/2, H/2 + 30);
  ctx.restore();

  // Thin orange top + bottom lines
  var ln = ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.4,'rgba(255,122,0,0.55)');
  ln.addColorStop(0.6,'rgba(255,122,0,0.55)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle = ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);

  // Play button on top
  playBtn(ctx, W/2, H/2, 96);

  // "scalevertise" small centered above top line — sits above Vimeo controls
  ctx.font = '300 22px Georgia, serif';
  ctx.letterSpacing = '6px';
  ctx.fillStyle = 'rgba(196,168,130,0.45)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('SCALEVERTISE', W/2, 68);
  ctx.letterSpacing = '0px';
})();

/* ===== B: GHOST STAT ===== */
/* "30" in enormous faded text, play button sits on it, one short line below */
(function(){
  var c = document.getElementById('cB'), ctx = c.getContext('2d');

  // Base
  ctx.fillStyle = '#090807'; ctx.fillRect(0,0,W,H);

  // Warm glow center-left
  var glow = ctx.createRadialGradient(W*0.42,H*0.48,0,W*0.42,H*0.48,W*0.55);
  glow.addColorStop(0,'rgba(255,122,0,0.1)');
  glow.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

  // Ghost "30"
  ctx.save();
  ctx.font = 'bold 640px Georgia, serif';
  ctx.fillStyle = 'rgba(255,122,0,0.09)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('30', W/2, H/2);
  ctx.restore();

  // Edge vignette
  var vig = ctx.createRadialGradient(W/2,H/2,H*0.05,W/2,H/2,W*0.65);
  vig.addColorStop(0,'rgba(9,8,7,0)'); vig.addColorStop(1,'rgba(9,8,7,0.85)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  // Left orange bar
  ctx.fillStyle = '#FF7A00'; ctx.fillRect(0,0,6,H);

  // Play button slightly above center
  playBtn(ctx, W/2, H/2 - 30, 90);

  // Single line below play
  ctx.font = '400 26px system-ui, sans-serif';
  ctx.letterSpacing = '3px';
  ctx.fillStyle = 'rgba(246,242,232,0.4)';
  ctx.textAlign = 'center';
  ctx.fillText('BEDS FILLED IN 30 DAYS', W/2, H/2 + 110);
  ctx.letterSpacing = '0px';

  // Brand top right — clear of Vimeo overlay zone (bottom)
  ctx.font = 'bold 20px Georgia, serif';
  ctx.fillStyle = 'rgba(255,122,0,0.5)';
  ctx.textAlign = 'right';
  ctx.fillText('SV', W - 48, 60);
  ctx.font = '300 18px Georgia, serif';
  ctx.fillStyle = 'rgba(196,168,130,0.4)';
  ctx.fillText('scalevertise', W - 48, 84);
})();

/* ===== C: ORANGE SLASH ===== */
/* Diagonal orange band across the frame, play button sits centered on it */
(function(){
  var c = document.getElementById('cC'), ctx = c.getContext('2d');

  // Dark base
  ctx.fillStyle = '#0c0a08'; ctx.fillRect(0,0,W,H);

  // Dot grid
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (var x=52;x<W;x+=52) for (var y=52;y<H;y+=52) {
    ctx.beginPath(); ctx.arc(x,y,1.1,0,Math.PI*2); ctx.fill();
  }

  // Diagonal slash — orange band
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(-14 * Math.PI / 180);
  var slash = ctx.createLinearGradient(0, -160, 0, 160);
  slash.addColorStop(0,   'rgba(255,122,0,0)');
  slash.addColorStop(0.2, 'rgba(255,122,0,0.18)');
  slash.addColorStop(0.5, 'rgba(255,122,0,0.28)');
  slash.addColorStop(0.8, 'rgba(255,122,0,0.18)');
  slash.addColorStop(1,   'rgba(255,122,0,0)');
  ctx.fillStyle = slash;
  ctx.fillRect(-W, -160, W*2, 320);
  ctx.restore();

  // Vignette
  var vig = ctx.createRadialGradient(W/2,H/2,H*0.12,W/2,H/2,W*0.7);
  vig.addColorStop(0,'rgba(12,10,8,0)'); vig.addColorStop(1,'rgba(12,10,8,0.88)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  // Thin accent lines top + bottom
  var ln = ctx.createLinearGradient(0,0,W,0);
  ln.addColorStop(0,'rgba(255,122,0,0)');
  ln.addColorStop(0.35,'rgba(255,122,0,0.5)');
  ln.addColorStop(0.65,'rgba(255,122,0,0.5)');
  ln.addColorStop(1,'rgba(255,122,0,0)');
  ctx.fillStyle = ln;
  ctx.fillRect(0,0,W,2); ctx.fillRect(0,H-2,W,2);

  // Play button dead center
  playBtn(ctx, W/2, H/2, 96);

  // Brand top center — above Vimeo controls zone
  ctx.font = 'bold 22px Georgia, serif';
  ctx.fillStyle = 'rgba(255,122,0,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText('SV', W/2 - 52, 64);
  ctx.font = '300 20px Georgia, serif';
  ctx.fillStyle = 'rgba(196,168,130,0.4)';
  ctx.fillText('scalevertise', W/2 + 28, 64);
})();
</script>
</body>
</html>
